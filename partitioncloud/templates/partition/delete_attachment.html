{% extends 'base.html' %}

{% block header %}
<h1>{% block title %}{{ _("Delete %(name)s", name=attachment.name) }}{% endblock %}</h1>
{% endblock %}

{% block content %}
{{ _("Do you really want to delete this attachment?") }}
<form method="post">
  <input type="submit" class="red-confirm" id="delete-attachment" value="{{ _('Delete') }}">
</form>
<a class="button-href" href="/partition/{{ attachment.partition_uuid }}/details">
  <button class="pc-button" id="cancel-deletion">{{ _("Cancel") }}</button>
</a>

{% endblock %}
