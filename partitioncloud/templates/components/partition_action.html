{# Small icon button shown over a score thumbnail. #}
{% macro partition_action(href, label, icon) %}
<a class="partition-action" href="{{ href }}" title="{{ label }}" aria-label="{{ label }}">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        {% if icon == "attachments" %}
        <path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path>
        <path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path>
        <path d="M9 17v-13h10v13"></path>
        <path d="M9 8h10"></path>
        {% elif icon == "edit" %}
        <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"></path>
        <path d="M13.5 6.5l4 4"></path>
        {% endif %}
    </svg>
</a>
{% endmacro %}
